<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <div class="layout-container">
        <div class="header">
            <h1>Doer's To Do</h1>
        </div>

        <div class="side-panel">
            <div class="filter-container">
                <button> All </button>
                <button> Today </button>
                <button> Week </button>
                <button> Completed </button>
            </div>

            <div class="project-container">
                <h2>Projects</h2>
                <div class="projects">

                </div>
                <button class="create-project-button"> New Project + </button>
            </div>
        </div>

        <div class="task-container">
            <div class="current-project">
                <h2 class="current-project-header"> Testing </h2>
                <hr>
                <button class="add-task-button"> Add Task </button>
            </div>

            <div class="display-task-container">
                <div class="item-card">
                    <div class="item-content">
                        
                    </div>
                    <input id="task-done" type="checkbox" name="task-done">
                        <div>
                            <h3>This is the title</h3>
                            <p>This is the description </p>
                            <p>This is the date</p>
                        </div>
                        <div class="project-buttons-container">
                            <button><img src="./img/note-edit.svg" alt="Project Edit button"></button>
                            <button><img src="./img/trashcan.svg" alt="Project Delete button"></button>
                        </div>
                </div>

                <div class="item-card">
                    <div class="item-content">
                        
                    </div>
                    <input id="task-done" type="checkbox" name="task-done">
                        <div>
                            <h3>This is the title</h3>
                            <p>This is the description </p>
                            <p>This is the date</p>
                        </div>
                        <div class="project-buttons-container">
                            <button><img src="./img/note-edit.svg" alt="Project Edit button"></button>
                            <button><img src="./img/trashcan.svg" alt="Project Delete button"></button>
                        </div>
                </div>
            </div>
        </div>

        <dialog id="project-dialog">
            <div>
                <h2 class="project-form-H2"> New Project </h2>
            </div>
            
            <form class="project-creation-form">
                <label for="projectName">Project Name</label>
                <input type="text" id="projectName" name="projectName" required>
                <div>
                    <button id="project-save-button" class="save-button" type="submit"> Save </button>
                    <button id="project-close-button" class="close-button" type="button" command="close" commandfor="project-dialog"> Cancel </button>
                </div>
            </form>
        </dialog>

        <dialog id="task-dialog">
            <div>
                <h2 class="task-form-H2"> New Task </h2>
            </div>

            <form class="task-creation-form">
                <div>
                    <label for="taskName">Title</label>
                    <input type="text" id="taskName" name="taskName" class="input" required>
                </div>
                <div>
                    <label for="description">Description</label>
                    <textarea id="description" name="description" class="input" rows="8"></textarea>
                </div>
                <div>
                    <label for="dueDate">Due Date</label>
                    <input type="date" id="dueDate" name="dueDate" class="input">
                </div>
                <div>
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority" class="input">
                        <option value="4"> None </option>
                        <option value="3"> Low </option>
                        <option value="2"> Medium </option>
                        <option value="1"> High </option>
                    </select>
                </div>
                <div>
                    <label for="projectId"> Project </label>
                    <select id="projectId" name="projectId" class="input">
                        <option> Placeholder for now </option> <!--use js to render all available projects-->
                    </select>
                </div>
                <div class="dialog-button-div">
                    <button class="save-button" type="submit" id="task-save-button"> Save </button>
                    <button class="close-button" id="task-close-button" type="button" command="close" commandfor="task-dialog"> Cancel </button>
                </div>
            </form>
        </dialog>

    </div>
</body>
</html>
