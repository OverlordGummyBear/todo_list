<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <div class="layout-container">
        <div class="header">
            <h1>Doer's To Do</h1>
        </div>

        <div class="side-panel">
            <div class="filter-container">
                <button> All </button>
                <button> Today </button>
                <button> Week </button>
                <button> Completed </button>
            </div>

            <div class="project-container">
                <h2>Projects</h2>
                <div class="projects">

                </div>
                <button class="create-project-button">New Project + </button>
            </div>
        </div>

        <div class="task-container">
            <div class="current-project">
                <h2 class="current-project-header"> Testing </h2>
                <hr>
            </div>

            <div>

            </div>
        </div>

        <dialog id="project-dialog">
            <div>
                <h2 class="project-form-H2"> New Project </h2>
            </div>
            
            <form class="project-creation-form">
                <label for="projectName">Project Name</label>
                <input type="text" id="projectName" name="projectName" required>
                <div>
                    <button type="submit"> Save </button>
                    <button type="button" command="close" commandfor="project-dialog"> Cancel </button>
                </div>
            </form>
        </dialog>
    </div>
</body>
</html>
